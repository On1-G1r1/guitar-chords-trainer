<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar & Music Club</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Стили для караоке-текста с аккордами над строкой */
.lyrics-container {
    background: #121214;
    padding: 25px;
    border-radius: 8px;
    line-height: 2.8; /* Большой интервал, чтобы аккорды не налезали на текст */
    font-size: 1.1rem;
    color: #e1e1e6;
    overflow-x: auto;
    white-space: pre-wrap;
}

/* Обертка для аккорда, чтобы он позиционировался над словом */
.chord-wrapper {
    position: relative;
    display: inline-block;
    color: #ffb64d;
    font-weight: 700;
    margin-right: 2px;
}

.chord-wrapper::before {
    content: attr(data-chord);
    position: absolute;
    bottom: 1.4rem; /* Поднимаем аккорд строго НАД строчкой текста */
    left: 0;
    background: rgba(0, 173, 181, 0.15);
    color: #00adb5;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9rem;
    line-height: 1;
    border: 1px solid rgba(0, 173, 181, 0.3);
}

/* Блок аппликатур (картинок грифа) в самом низу */
.chords-diagrams-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #29292e;
}

.diagram-card {
    background: #202024;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid #29292e;
}

.diagram-card h5 {
    color: #00adb5;
    font-size: 1.1rem;
    margin-bottom: 10px;
}

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #121214; color: #e1e1e6; padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { color: #00adb5; font-size: 2.5rem; margin-bottom: 10px; }
        .section { background: #1a1a1e; padding: 30px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #29292e; }
        h2 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; border-bottom: 2px solid #00adb5; padding-bottom: 8px; inline-size: max-content;}
        .flex-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        label { font-size: 0.9rem; color: #a8a8b3; }
        select, input, textarea { background: #202024; border: 1px solid #29292e; color: #fff; padding: 12px; border-radius: 6px; font-size: 1rem; }
        select:focus, input:focus, textarea:focus { border-color: #00adb5; outline: none; }
        button { background: #00adb5; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #008c95; }
        .chord-box { display: inline-block; background: #29292e; color: #00adb5; font-size: 2rem; font-weight: 700; padding: 15px 25px; margin: 10px; border-radius: 8px; border: 2px solid #00adb5; box-shadow: 0 4px 10px rgba(0,173,181,0.2); }
        #chordsResult { text-align: center; min-height: 80px; margin-top: 20px; }
        .song-card { background: #202024; padding: 20px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #00adb5; }
        .song-card h3 { color: #fff; margin-bottom: 5px; }
        .song-card h4 { color: #a8a8b3; font-weight: 400; margin-bottom: 15px; }
        pre { background: #121214; padding: 15px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 1.1rem; color: #ffb64d; white-space: pre-wrap; }
        .w-100 { width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎸 Guitar & Music Club</h1>
            <p>Твой интерактивный тренажер и каталог табулатур</p>
        </header>

        <!-- 1. ГЕНЕРАТОР АККОРДОВ -->
        <div class="section">
            <h2>Генератор аккордов для тренировки</h2>
            <div class="flex-group">
                <div>
                    <label>Тональность:</label><br>
                    <select id="chordKey">
                        <option value="">Любая</option>
                        <option value="Am">Am (ля-минор)</option>
                        <option value="C">C (до-мажор)</option>
                        <option value="G">G (соль-мажор)</option>
                        <option value="Em">Em (ми-минор)</option>
                    </select>
                </div>
                <div>
                    <label>Сложность:</label><br>
                    <select id="chordLevel">
                        <option value="easy">Без баррэ (Easy)</option>
                        <option value="hard">С баррэ (Hard)</option>
                    </select>
                </div>
                <div>
                    <label>Количество:</label><br>
                    <input type="number" id="chordLength" value="4" min="2" max="10" style="width: 80px;">
                </div>
                <div style="padding-top: 20px;">
                    <button onclick="generateChords()">Сгенерировать</button>
                </div>
            </div>
            <div id="chordsResult"></div>
        </div>

        <!-- 2. ГЕНЕРАТОР БОЯ -->
        <div class="section">
            <h2>Генератор случайного боя</h2>
            <div class="flex-group">
                <div>
                    <label>Тип рисунка:</label><br>
                    <select id="strumType">
                        <option value="all">Любой бой</option>
                        <option value="44">Размер 4/4 (Эстрадный, Четверка)</option>
                        <option value="34">Размер 3/4 (Вальсовый)</option>
                    </select>
                </div>
                <div style="padding-top: 20px;">
                    <button onclick="generateStrum()">Сгенерировать бой</button>
                </div>
            </div>
            <div id="strumResult" style="text-align: center; font-size: 1.5rem; font-weight: 600; color: #ffb64d; margin-top: 15px; letter-spacing: 3px;"></div>
        </div>

        <!-- 3. ВСТРОЕННЫЙ МЕТРОНОМ -->
        <div class="section">
            <h2>Встроенный метроном</h2>
            <div class="flex-group">
                <div>
                    <label>Темп (BPM):</label><br>
                    <input type="number" id="bpmInput" value="120" min="40" max="250" style="width: 100px;">
                </div>
                <div style="padding-top: 20px;">
                    <button id="metronomeBtn" onclick="toggleMetronome()">Старт</button>
                </div>
            </div>
        </div>

        <!-- 4. КАТАЛОГ И ПОИСК ТАБУЛАТУР -->
        <div class="section">
            <h2>Каталог гитарных табул</h2>
            <div class="flex-group">
                <input type="text" id="searchInput" class="w-100" placeholder="Введите название песни или имя исполнителя для поиска..." oninput="searchSongs()">
            </div>
            <div id="songsResult"></div>
        </div>

        <!-- 5. ЗАГРУЗКА АУДИО И AI РАСПОЗНАВАНИЕ -->
        <div class="section">
            <h2>AI Распознавание аккордов из аудиофайла (Magic Chords Mode)</h2>
            <div class="flex-group">
                <input type="text" id="audioArtist" placeholder="Исполнитель (например, Linkin Park)" style="flex: 1;">
                <input type="text" id="audioTitle" placeholder="Название трека (например, Numb)" style="flex: 1;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label>Выберите трек (.mp3, .wav, .flac):</label><br><br>
                <input type="file" id="audioFile" accept=".mp3,.wav,.flac,.m4a">
            </div>

            <button onclick="uploadAndRecognizeAudio()" style="background: #ffb64d; color: #121214; font-weight: bold;">
                🎙️ Загрузить аудио файл и извлечь аккорды
            </button>
            <br><br>
            <div id="aiStatus" style="color: #00adb5; font-weight: 600;"></div>
        </div>
    </div>

    <!-- Подключаем внешний JavaScript файл логики -->
    <script src="/static/app.js"></script>
</body>
</html>
